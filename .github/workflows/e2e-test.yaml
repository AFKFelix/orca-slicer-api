name: Run E2E Tests

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  test:
    name: E2E Test (Orca v${{ matrix.orca_version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        orca_version: ['2.3.0', '2.4.0', '2.4.2']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build E2E tests
        uses: docker/build-push-action@v5
        with:
          context: .
          file: tests/docker/Dockerfile.test
          push: false
          load: true
          tags: orca-v${{ matrix.orca_version }}-api-test
          build-args: |
            ORCA_VERSION=${{ matrix.orca_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run tests
        run: |
          docker run --rm orca-v${{ matrix.orca_version }}-api-test
